# =============================================================================
# CLIENTPILOT SPRING BOOT APPLICATION CONFIGURATION
# Hack With Hyderabad 3.0: AI Agents That Learn Using Hindsight
# =============================================================================

spring.application.name=clientpilot-backend
server.port=8080

# -----------------------------------------------------------------------------
# PostgreSQL Database Configuration
# -----------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clientpilot}
spring.datasource.username=${DATABASE_USERNAME:clientpilot}
spring.datasource.password=${DATABASE_PASSWORD:clientpilot123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# Hindsight Memory Service Configuration (Vectorize.io Protocol)
# Standalone Docker or Hindsight Cloud (api.hindsight.vectorize.io)
# -----------------------------------------------------------------------------
hindsight.base-url=${HINDSIGHT_BASE_URL:https://api.hindsight.vectorize.io}
hindsight.api-key=${HINDSIGHT_API_KEY:}
hindsight.timeout-ms=6000
hindsight.memory-bank.prefix=bank_

# -----------------------------------------------------------------------------
# AI LLM Provider Configuration (Google Gemini / Configurable)
# -----------------------------------------------------------------------------
ai.llm.provider=${LLM_PROVIDER:gemini}
ai.llm.api-key=${GEMINI_API_KEY:}
ai.llm.model=${GEMINI_MODEL:gemini-3.8-flash}
ai.llm.temperature=0.2

# -----------------------------------------------------------------------------
# CORS Configuration
# -----------------------------------------------------------------------------
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
